<style>
  :root {
    --bg: #f4f9f5;
    --bg2: #ffffff;
    --surface: #eaf5ee;
    --ink: #2d4a35;
    --muted: #7a9583;
    --rule: #d4e8db;
    --accent: #6bbf8a;
    --accent-soft: #a8d5ba;
    --accent-deep: #4a9d6a;
    --accent2: #f0a8c0;
    --danger: #e88a8a;
    --warn: #f4c95d;
    --shadow: 0 2px 12px rgba(107, 191, 138, 0.12);
    --shadow-hover: 0 4px 20px rgba(107, 191, 138, 0.2);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.6;
  }

  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== 左侧任务栏 ===== */
  .sidebar {
    width: 280px;
    background: linear-gradient(180deg, #d4edd9 0%, #eaf5ee 100%);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--rule);
  }

  .sidebar-header h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent-deep);
    letter-spacing: 0.5px;
  }

  .sidebar-header p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .task-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px;
  }

  .task-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
    position: relative;
    gap: 10px;
  }

  .task-item:hover {
    background: rgba(255, 255, 255, 0.6);
  }

  .task-item.active {
    background: var(--bg2);
    border-color: var(--accent-soft);
    box-shadow: var(--shadow);
  }

  .task-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .task-name-wrap {
    flex: 1;
    min-width: 0;
  }

  .task-name-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .task-name-input {
    width: 100%;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: inherit;
    outline: none;
    background: var(--bg2);
  }

  .task-actions {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-shrink: 0;
  }

  .task-actions .icon-btn {
    width: 26px;
    height: 26px;
    border: none;
    background: none;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
    opacity: 0.5;
  }

  .task-item:hover .icon-btn,
  .task-item.editing .icon-btn {
    opacity: 1;
  }

  .icon-btn.edit-btn { color: var(--accent-deep); }
  .icon-btn.edit-btn:hover { background: rgba(107, 191, 138, 0.15); }
  .icon-btn.del-btn { color: var(--danger); }
  .icon-btn.del-btn:hover { background: rgba(232, 138, 138, 0.15); }
  .icon-btn.confirm-btn { color: var(--accent-deep); }
  .icon-btn.confirm-btn:hover { background: rgba(107, 191, 138, 0.15); }
  .icon-btn.cancel-btn { color: var(--muted); }
  .icon-btn.cancel-btn:hover { background: rgba(122, 149, 131, 0.12); }

  .add-task-btn {
    margin: 0 12px 16px;
    padding: 12px;
    border: 2px dashed var(--accent-soft);
    background: transparent;
    border-radius: var(--radius-sm);
    color: var(--accent-deep);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .add-task-btn:hover {
    background: rgba(168, 213, 186, 0.2);
    border-color: var(--accent);
  }

  /* ===== 右侧主区 ===== */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 36px;
  }

  .main-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }

  .main-title h2 {
    font-size: 26px;
    font-weight: 800;
    color: var(--ink);
  }

  .today-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    padding: 4px 14px;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    color: #fff;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .view-tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border-radius: 10px;
    padding: 4px;
    width: fit-content;
    margin-bottom: 20px;
  }

  .view-tab {
    padding: 8px 20px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .view-tab.active {
    background: var(--bg2);
    color: var(--accent-deep);
    box-shadow: 0 1px 4px rgba(107, 191, 138, 0.15);
  }

  .view-tab:hover:not(.active) {
    color: var(--ink);
  }

  /* ===== 日视图：今日工作台 ===== */
  .day-view {}

  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .day-header .date-display {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }

  .day-header .day-progress {
    font-size: 14px;
    color: var(--muted);
  }

  .day-header .day-progress span {
    color: var(--accent-deep);
    font-weight: 700;
  }

  .day-task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .day-task-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg2);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    box-shadow: var(--shadow);
    transition: all 0.2s;
    border: 1px solid transparent;
  }

  .day-task-row:hover {
    border-color: var(--rule);
  }

  .day-task-row.done {
    background: var(--surface);
    opacity: 0.85;
  }

  .day-task-row .dt-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .day-task-row .dt-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    width: 100px;
    flex-shrink: 0;
  }

  .day-task-row.done .dt-name {
    text-decoration: line-through;
    color: var(--muted);
  }

  .day-task-row .dt-note {
    flex: 1;
  }

  .day-task-row .dt-note input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
  }

  .day-task-row .dt-note input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg2);
  }

  .day-task-row .dt-check {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    font-family: inherit;
  }

  .day-task-row .dt-check.unchecked {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #fff;
    box-shadow: 0 2px 8px rgba(107, 191, 138, 0.3);
  }

  .day-task-row .dt-check.unchecked:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 12px rgba(107, 191, 138, 0.4);
  }

  .day-task-row .dt-check.checked {
    background: var(--surface);
    color: var(--accent-deep);
    border: 1px solid var(--accent-soft);
  }

  /* 未打卡提醒 */
  .day-task-row.missed .dt-name {
    color: var(--danger);
  }

  .day-task-row.missed {
    border-color: rgba(232, 138, 138, 0.3);
    background: #fff8f8;
  }

  .missed-badge {
    font-size: 11px;
    color: var(--danger);
    background: rgba(232, 138, 138, 0.12);
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    font-weight: 600;
  }

  /* ===== 月视图：紧凑日历 ===== */
  .month-view {}

  .month-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .month-header-bar h3 {
    font-size: 16px;
    font-weight: 700;
  }

  .month-nav {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .month-nav button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--rule);
    background: var(--bg2);
    border-radius: 50%;
    cursor: pointer;
    color: var(--accent-deep);
    font-size: 12px;
    transition: all 0.2s;
  }

  .month-nav button:hover {
    background: var(--surface);
    border-color: var(--accent);
  }

  .month-nav .month-label {
    font-weight: 600;
    font-size: 14px;
    min-width: 90px;
    text-align: center;
  }

  .mini-calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .mc-weekday {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    padding: 6px 0;
  }

  .mc-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
    position: relative;
    background: var(--bg);
    min-height: 36px;
  }

  .mc-day:hover:not(.empty) {
    border-color: var(--accent-soft);
  }

  .mc-day.empty {
    background: transparent;
    cursor: default;
  }

  .mc-day.checked {
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    color: #fff;
    font-weight: 700;
  }

  .mc-day.today {
    border: 2px solid var(--accent-deep);
    font-weight: 700;
  }

  .mc-day.missed {
    background: #fff0f0;
    color: var(--danger);
  }

  .mc-day .missed-dot {
    position: absolute;
    bottom: 3px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--danger);
  }

  .mc-day .note-dot {
    position: absolute;
    bottom: 3px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent2);
  }

  .mc-day.checked .note-dot {
    background: #fff;
  }

  /* ===== 年视图 ===== */
  .year-view {}

  .year-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .year-header-bar h3 {
    font-size: 16px;
    font-weight: 700;
  }

  .year-nav {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .year-nav button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--rule);
    background: var(--bg2);
    border-radius: 50%;
    cursor: pointer;
    color: var(--accent-deep);
    font-size: 12px;
    transition: all 0.2s;
  }

  .year-nav button:hover {
    background: var(--surface);
    border-color: var(--accent);
  }

  .year-nav .year-label {
    font-weight: 600;
    font-size: 14px;
    min-width: 60px;
    text-align: center;
  }

  .year-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .year-month-card {
    background: var(--bg2);
    border-radius: var(--radius-sm);
    padding: 14px;
    box-shadow: var(--shadow);
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .year-month-card:hover {
    border-color: var(--rule);
  }

  .year-month-card .ym-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .year-month-card .ym-count {
    font-size: 12px;
    color: var(--accent-deep);
    font-weight: 600;
  }

  .ym-bar {
    height: 6px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .ym-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-soft), var(--accent));
    border-radius: 3px;
    transition: width 0.5s;
  }

  .ym-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .ym-day {
    aspect-ratio: 1;
    border-radius: 2px;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }

  .ym-day.checked {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
  }

  .ym-day.missed {
    background: rgba(232, 138, 138, 0.2);
    color: var(--danger);
  }

  .ym-day.today {
    border: 1px solid var(--accent-deep);
  }

  /* ===== 任务描述卡片 ===== */
  .desc-card {
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }

  .desc-card label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1px;
    display: block;
    margin-bottom: 8px;
  }

  .desc-text {
    width: 100%;
    min-height: 50px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    padding: 10px;
    font-size: 14px;
    color: var(--ink);
    font-family: inherit;
    resize: vertical;
    background: var(--bg);
    transition: border 0.2s;
  }

  .desc-text:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg2);
  }

  /* ===== 通用 ===== */
  .view-panel { display: none; }
  .view-panel.active { display: block; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent-deep);
    color: #fff;
    padding: 12px 28px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(74, 157, 106, 0.4);
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.warn { background: #d4a03a; }
  .toast.err { background: var(--danger); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--accent-soft); border-radius: 3px; }

  /* ===== 同步设置面板 ===== */
  .sync-modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(45, 74, 53, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    backdrop-filter: blur(4px);
  }
  .sync-modal-overlay.show { display: flex; }

  .sync-modal {
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 28px;
    width: 420px;
    max-width: 90vw;
    box-shadow: 0 8px 40px rgba(45, 74, 53, 0.2);
    animation: modalIn 0.25s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .sync-modal h3 {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 16px;
    color: var(--ink);
  }

  .sync-modal .field {
    margin-bottom: 14px;
  }
  .sync-modal .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .sync-modal .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
  }
  .sync-modal .field input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--bg2);
  }
  .sync-modal .field .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .sync-modal .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .sync-modal .btns button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .sync-modal .btns .primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #fff;
  }
  .sync-modal .btns .primary:hover {
    opacity: 0.9;
  }
  .sync-modal .btns .secondary {
    background: var(--surface);
    color: var(--ink);
  }
  .sync-modal .btns .secondary:hover {
    background: var(--rule);
  }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    padding: 10px 16px;
    border-top: 1px solid var(--rule);
    cursor: pointer;
    transition: background 0.2s;
  }
  .sync-status:hover {
    background: rgba(255,255,255,0.4);
  }
  .sync-status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--rule);
  }
  .sync-status .dot.on { background: var(--accent); }
  .sync-status .dot.off { background: var(--danger); }

  /* 更新提示条 */
  .sync-alert {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--bg2);
    border: 1px solid var(--accent-soft);
    border-radius: var(--radius);
    padding: 14px 24px;
    box-shadow: var(--shadow-hover);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1500;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90vw;
  }
  .sync-alert.show {
    transform: translateX(-50%) translateY(0);
  }
  .sync-alert span {
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
  }
  .sync-alert button {
    padding: 6px 16px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  /* ===== 移动端适配 ===== */
  @media (max-width: 900px) {
    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ---- 顶部任务栏 ---- */
    .sidebar {
      width: 100%;
      height: auto;
      max-height: none;
      min-height: auto;
      border-right: none;
      border-bottom: 1px solid var(--rule);
      background: var(--bg2);
      flex-shrink: 0;
      padding-top: env(safe-area-inset-top);
    }

    .sidebar-header {
      display: none;
    }

    .task-list {
      flex-direction: row;
      gap: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex: 1;
    }
    .task-list::-webkit-scrollbar { display: none; }

    .task-item {
      flex-shrink: 0;
      padding: 8px 14px;
      margin-bottom: 0;
      border-radius: 20px;
      background: var(--surface);
      gap: 6px;
      border: 1px solid var(--rule);
      min-height: 36px;
    }
    .task-item.active {
      background: linear-gradient(135deg, var(--accent-soft), var(--accent));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(107, 191, 138, 0.35);
    }
    .task-item.active .task-name-text {
      color: #fff;
    }
    .task-item:active {
      transform: scale(0.96);
    }

    .task-dot { width: 8px; height: 8px; }
    .task-name-text { font-size: 14px; }
    .task-name-input {
      font-size: 14px;
      width: 90px;
      padding: 3px 6px;
    }
    .task-actions {
      display: none;
    }

    .add-task-btn {
      display: none;
    }

    .sync-status {
      position: absolute;
      top: calc(8px + env(safe-area-inset-top));
      right: 12px;
      padding: 4px 10px;
      border: none;
      background: var(--surface);
      border-radius: 12px;
      font-size: 11px;
      z-index: 10;
      border: 1px solid var(--rule);
    }

    /* ---- 主内容区 ---- */
    .main {
      flex: 1;
      padding: 12px 16px calc(12px + 56px + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .main-header {
      margin-bottom: 12px;
      align-items: center;
    }

    .main-title h2 {
      font-size: 20px;
    }

    .today-badge {
      font-size: 11px;
      padding: 3px 10px;
      margin-top: 4px;
    }

    /* 任务描述 */
    .desc-card {
      padding: 14px;
      margin-bottom: 14px;
      border-radius: var(--radius-sm);
    }
    .desc-card label {
      font-size: 11px;
      margin-bottom: 6px;
    }
    .desc-text {
      font-size: 15px;
      min-height: 40px;
      padding: 8px;
    }

    /* 视图切换 -> 底部固定导航 */
    .view-tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      margin-bottom: 0;
      border-radius: 0;
      padding: 4px 0 calc(4px + env(safe-area-inset-bottom));
      background: var(--bg2);
      border-top: 1px solid var(--rule);
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
      gap: 0;
      justify-content: space-around;
    }
    .view-tab {
      flex: 1;
      padding: 10px 8px;
      font-size: 13px;
      border-radius: 0;
      text-align: center;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .view-tab.active {
      box-shadow: none;
      background: transparent;
      color: var(--accent-deep);
      position: relative;
    }
    .view-tab.active::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 30%;
      right: 30%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-soft), var(--accent));
      border-radius: 2px;
    }

    /* 日视图 */
    .day-header {
      margin-bottom: 12px;
    }
    .day-header .date-display {
      font-size: 16px;
    }
    .day-header .day-progress {
      font-size: 13px;
    }

    .day-task-list {
      gap: 8px;
    }
    .day-task-row {
      padding: 12px 14px;
      gap: 10px;
      flex-wrap: nowrap;
    }
    .day-task-row .dt-name {
      width: auto;
      font-size: 14px;
      flex-shrink: 0;
      max-width: 80px;
    }
    .day-task-row .dt-note {
      min-width: 0;
    }
    .day-task-row .dt-note input {
      font-size: 14px;
      padding: 6px 10px;
    }
    .day-task-row .dt-check {
      padding: 8px 16px;
      font-size: 13px;
      min-height: 36px;
    }

    /* 月视图 */
    .month-header-bar {
      margin-bottom: 12px;
    }
    .month-header-bar h3 {
      font-size: 15px;
    }
    .mini-calendar {
      gap: 3px;
    }
    .mc-weekday {
      font-size: 10px;
      padding: 4px 0;
    }
    .mc-day {
      font-size: 12px;
      min-height: 32px;
      border-radius: 6px;
    }

    /* 年视图 */
    .year-header-bar {
      margin-bottom: 12px;
    }
    .year-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .year-month-card {
      padding: 10px;
    }
    .year-month-card .ym-title {
      font-size: 12px;
    }
    .year-month-card .ym-bar-wrap {
      height: 6px;
    }
    .year-month-card .ym-rate {
      font-size: 11px;
    }

    /* Toast */
    .toast {
      bottom: calc(70px + env(safe-area-inset-bottom));
      font-size: 14px;
      padding: 10px 20px;
    }

    /* 同步提示条 */
    .sync-alert {
      top: calc(8px + env(safe-area-inset-top));
      padding: 10px 16px;
      gap: 10px;
    }
    .sync-alert span {
      font-size: 13px;
    }
    .sync-alert button {
      padding: 5px 12px;
      font-size: 12px;
    }

    /* 同步设置模态框 */
    .sync-modal-overlay {
      align-items: flex-end;
      padding: 0;
    }
    .sync-modal {
      width: 100%;
      max-width: 100%;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      animation: modalSlideUp 0.3s ease;
    }
    @keyframes modalSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sync-modal h3 {
      font-size: 17px;
    }
    .sync-modal .field input {
      font-size: 16px; /* 防止 iOS 缩放 */
      padding: 12px;
    }
    .sync-modal .btns button {
      padding: 12px;
      font-size: 15px;
      min-height: 44px;
    }
  }
</style>
</head>
<body>

<div class="app">
  <!-- 左侧任务栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>我要做港女</h1>
      <p>自律即自由 · 每日打卡</p>
    </div>
    <div class="task-list" id="taskList"></div>
    <button class="add-task-btn" id="addTaskBtn">+ 新增任务</button>
    <div class="sync-status" id="syncStatus">
      <span class="dot" id="syncDot"></span>
      <span id="syncStatusText">未开启同步</span>
    </div>
  </aside>

  <!-- 右侧主区 -->
  <main class="main">
    <div class="main-header">
      <div class="main-title">
        <h2 id="currentTaskName">上岸计划</h2>
        <span class="today-badge" id="todayBadge">今日任务</span>
      </div>
    </div>

    <!-- 任务描述 -->
    <div class="desc-card">
      <label>任务描述</label>
      <textarea class="desc-text" id="taskDesc" placeholder="写下这个任务的目标和计划..."></textarea>
    </div>

    <!-- 视图切换 -->
    <div class="view-tabs">
      <button class="view-tab active" data-view="day">今日</button>
      <button class="view-tab" data-view="month">月历</button>
      <button class="view-tab" data-view="year">年度</button>
    </div>

    <!-- 日视图 -->
    <div class="view-panel active" id="viewDay">
      <div class="day-header">
        <span class="date-display" id="dayDateDisplay"></span>
        <span class="day-progress">今日完成 <span id="dayProgressNum">0/4</span></span>
      </div>
      <div class="day-task-list" id="dayTaskList"></div>
    </div>

    <!-- 月视图 -->
    <div class="view-panel" id="viewMonth">
      <div class="month-header-bar">
        <h3>打卡日历</h3>
        <div class="month-nav">
          <button id="prevMonth">&lt;</button>
          <span class="month-label" id="monthLabel">2026年7月</span>
          <button id="nextMonth">&gt;</button>
        </div>
      </div>
      <div class="mini-calendar" id="miniCalendar"></div>
    </div>

    <!-- 年视图 -->
    <div class="view-panel" id="viewYear">
      <div class="year-header-bar">
        <h3>年度概览</h3>
        <div class="year-nav">
          <button id="prevYear">&lt;</button>
          <span class="year-label" id="yearLabel">2026</span>
          <button id="nextYear">&gt;</button>
        </div>
      </div>
      <div class="year-grid" id="yearGrid"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- 同步更新提示条 -->
<div class="sync-alert" id="syncAlert">
  <span>Mac 端有更新，是否同步？</span>
  <button id="syncAlertBtn">立即同步</button>
</div>

<!-- 同步设置模态框 -->
<div class="sync-modal-overlay" id="syncModalOverlay">
  <div class="sync-modal">
    <h3>云端同步设置</h3>
    <div class="field">
      <label>GitHub Personal Access Token</label>
      <input type="password" id="syncToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      <div class="hint">在 GitHub Settings → Developer settings → Personal access tokens → Tokens (classic) 中创建，仅勾选 "gist" 权限</div>
    </div>
    <div class="field">
      <label>同步 Gist ID（可选，留空则自动创建）</label>
      <input type="text" id="syncGistId" placeholder="例如：a1b2c3d4e5f6...">
      <div class="hint">如果你已在其他设备上创建过同步仓库，在这里填入 Gist ID</div>
    </div>
    <div class="btns">
      <button class="primary" id="syncSaveBtn">保存并连接</button>
      <button class="secondary" id="syncCloseBtn">取消</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'gangnv_workbench_v2';

  var defaultTasks = [
    { id: 't1', name: '上岸计划', desc: '考研/考公/求职准备，每天稳步推进', color: '#6bbf8a' },
    { id: 't2', name: '学英语', desc: '听说读写全面提升，雅思/托福/日常应用', color: '#f0a8c0' },
    { id: 't3', name: '运动', desc: '保持身材与健康，塑形减脂', color: '#7ec8e3' },
    { id: 't4', name: '经济视频', desc: '观看经济类视频，提升财商认知', color: '#f4c95d' }
  ];

  var state = {
    tasks: [],
    checkins: {},
    currentTaskId: null,
    view: 'day',
    calYear: new Date().getFullYear(),
    calMonth: new Date().getMonth(),
    calYearView: new Date().getFullYear()
  };

  function loadData() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        var data = JSON.parse(saved);
        state.tasks = data.tasks || defaultTasks.slice();
        state.checkins = data.checkins || {};
        state.currentTaskId = data.currentTaskId || (state.tasks[0] && state.tasks[0].id);
      } else {
        state.tasks = defaultTasks.slice();
        state.currentTaskId = state.tasks[0].id;
        state.checkins = {};
      }
    } catch(e) {
      state.tasks = defaultTasks.slice();
      state.currentTaskId = state.tasks[0].id;
      state.checkins = {};
    }
    state.tasks.forEach(function(t) {
      if (!state.checkins[t.id]) state.checkins[t.id] = {};
    });
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tasks: state.tasks,
      checkins: state.checkins,
      currentTaskId: state.currentTaskId
    }));
  }

  function fmtDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function todayStr() { return fmtDate(new Date()); }

  function getTask(id) { return state.tasks.find(function(t) { return t.id === id; }); }
  function getCheckins(id) { return state.checkins[id] || {}; }

  function isWorkday(dateStr) {
    var d = new Date(dateStr);
    var wd = d.getDay();
    return wd >= 1 && wd <= 5;
  }

  function showToast(msg, type) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast' + (type ? ' ' + type : '');
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2000);
  }

  function calcStreak(checkins) {
    var streak = 0;
    var d = new Date();
    if (!checkins[fmtDate(d)]) d.setDate(d.getDate() - 1);
    while (checkins[fmtDate(d)]) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  // ===== 左侧任务栏渲染 =====
  var editingTaskId = null;
  var editingOriginalName = '';

  function renderTaskList() {
    var list = document.getElementById('taskList');
    list.innerHTML = '';
    state.tasks.forEach(function(task) {
      var item = document.createElement('div');
      item.className = 'task-item' + (task.id === state.currentTaskId ? ' active' : '');
      if (editingTaskId === task.id) item.classList.add('editing');
      item.dataset.id = task.id;

      var dot = document.createElement('span');
      dot.className = 'task-dot';
      dot.style.background = task.color || '#6bbf8a';

      var nameWrap = document.createElement('div');
      nameWrap.className = 'task-name-wrap';

      if (editingTaskId === task.id) {
        var input = document.createElement('input');
        input.className = 'task-name-input';
        input.value = task.name;
        input.spellcheck = false;
        nameWrap.appendChild(input);
        setTimeout(function() { input.focus(); input.select(); }, 10);

        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); confirmEdit(); }
          if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
        });
      } else {
        var nameText = document.createElement('div');
        nameText.className = 'task-name-text';
        nameText.textContent = task.name;
        nameWrap.appendChild(nameText);
      }

      var actions = document.createElement('div');
      actions.className = 'task-actions';

      if (editingTaskId === task.id) {
        var confirmBtn = document.createElement('button');
        confirmBtn.className = 'icon-btn confirm-btn';
        confirmBtn.innerHTML = '&#10003;';
        confirmBtn.title = '确定';
        confirmBtn.addEventListener('click', function(e) { e.stopPropagation(); confirmEdit(); });

        var cancelBtn = document.createElement('button');
        cancelBtn.className = 'icon-btn cancel-btn';
        cancelBtn.innerHTML = '&#10005;';
        cancelBtn.title = '取消';
        cancelBtn.addEventListener('click', function(e) { e.stopPropagation(); cancelEdit(); });

        actions.appendChild(confirmBtn);
        actions.appendChild(cancelBtn);
      } else {
        var editBtn = document.createElement('button');
        editBtn.className = 'icon-btn edit-btn';
        editBtn.innerHTML = '&#9998;';
        editBtn.title = '编辑';
        editBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          startEdit(task.id);
        });

        var delBtn = document.createElement('button');
        delBtn.className = 'icon-btn del-btn';
        delBtn.innerHTML = '&times;';
        delBtn.title = '删除';
        delBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (state.tasks.length <= 1) { showToast('至少保留一个任务'); return; }
          if (confirm('确定删除「' + task.name + '」及其所有打卡记录？')) {
            state.tasks = state.tasks.filter(function(t) { return t.id !== task.id; });
            delete state.checkins[task.id];
            if (state.currentTaskId === task.id) state.currentTaskId = state.tasks[0].id;
            saveData();
            renderAll();
          }
        });

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
      }

      item.appendChild(dot);
      item.appendChild(nameWrap);
      item.appendChild(actions);

      if (editingTaskId !== task.id) {
        item.addEventListener('click', function() {
          state.currentTaskId = task.id;
          saveData();
          renderAll();
        });
      }

      list.appendChild(item);
    });
  }

  function startEdit(taskId) {
    editingTaskId = taskId;
    editingOriginalName = getTask(taskId).name;
    renderTaskList();
  }

  function confirmEdit() {
    if (!editingTaskId) return;
    var input = document.querySelector('.task-item.editing .task-name-input');
    var newName = input ? input.value.trim() : '';
    var task = getTask(editingTaskId);
    if (newName && newName !== task.name) {
      task.name = newName;
      saveData();
    }
    editingTaskId = null;
    renderAll();
  }

  function cancelEdit() {
    editingTaskId = null;
    renderTaskList();
  }

  // ===== 右侧头部 =====
  function renderHeader() {
    var task = getTask(state.currentTaskId);
    if (!task) return;
    document.getElementById('currentTaskName').textContent = task.name;
    document.getElementById('taskDesc').value = task.desc || '';
  }

  // ===== 日视图：今日工作台 =====
  function renderDayView() {
    var now = new Date();
    var weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
    document.getElementById('dayDateDisplay').textContent =
      now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 ' + weekdays[now.getDay()];

    var list = document.getElementById('dayTaskList');
    list.innerHTML = '';
    var today = todayStr();
    var doneCount = 0;

    state.tasks.forEach(function(task) {
      var checkins = getCheckins(task.id);
      var isDone = !!checkins[today];
      var isMissed = !isDone && isWorkday(today);
      if (isDone) doneCount++;

      var row = document.createElement('div');
      row.className = 'day-task-row' + (isDone ? ' done' : '') + (isMissed ? ' missed' : '');

      var dot = document.createElement('span');
      dot.className = 'dt-dot';
      dot.style.background = task.color;

      var name = document.createElement('span');
      name.className = 'dt-name';
      name.textContent = task.name;
      if (isMissed) {
        var badge = document.createElement('span');
        badge.className = 'missed-badge';
        badge.textContent = '未打卡';
        name.appendChild(badge);
      }

      var noteWrap = document.createElement('div');
      noteWrap.className = 'dt-note';
      var noteInput = document.createElement('input');
      noteInput.type = 'text';
      noteInput.placeholder = '备注...';
      noteInput.value = isDone ? (checkins[today].note || '') : '';
      noteInput.disabled = isDone;
      noteInput.dataset.taskId = task.id;
      noteWrap.appendChild(noteInput);

      var btn = document.createElement('button');
      btn.className = 'dt-check' + (isDone ? ' checked' : ' unchecked');
      btn.textContent = isDone ? '已打卡' : '打卡';
      btn.dataset.taskId = task.id;
      btn.addEventListener('click', function() {
        var tid = this.dataset.taskId;
        var c = getCheckins(tid);
        if (c[today]) {
          delete c[today];
          showToast('已取消打卡');
        } else {
          var noteEl = document.querySelector('.dt-note input[data-task-id="' + tid + '"]');
          c[today] = { note: noteEl ? noteEl.value.trim() : '', time: Date.now() };
          showToast('打卡成功！');
        }
        saveData();
        renderAll();
      });

      // 回车快捷打卡
      noteInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          var tid = this.dataset.taskId;
          var c = getCheckins(tid);
          if (!c[today]) {
            c[today] = { note: this.value.trim(), time: Date.now() };
            saveData();
            renderAll();
            showToast('打卡成功！');
          }
        }
      });

      row.appendChild(dot);
      row.appendChild(name);
      row.appendChild(noteWrap);
      row.appendChild(btn);
      list.appendChild(row);
    });

    document.getElementById('dayProgressNum').textContent = doneCount + '/' + state.tasks.length;
  }

  // ===== 月视图 =====
  function renderMonthView() {
    var grid = document.getElementById('miniCalendar');
    grid.innerHTML = '';

    var weekdays = ['日','一','二','三','四','五','六'];
    weekdays.forEach(function(w) {
      var el = document.createElement('div');
      el.className = 'mc-weekday';
      el.textContent = w;
      grid.appendChild(el);
    });

    var year = state.calYear;
    var month = state.calMonth;
    document.getElementById('monthLabel').textContent = year + '年' + (month+1) + '月';

    var firstDay = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var today = todayStr();
    var task = getTask(state.currentTaskId);
    var checkins = task ? getCheckins(task.id) : {};

    for (var i = 0; i < firstDay; i++) {
      var empty = document.createElement('div');
      empty.className = 'mc-day empty';
      grid.appendChild(empty);
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var dayEl = document.createElement('div');
      dayEl.className = 'mc-day';
      dayEl.textContent = d;

      if (dateStr === today) dayEl.classList.add('today');

      if (checkins[dateStr]) {
        dayEl.classList.add('checked');
        if (checkins[dateStr].note) {
          var dot = document.createElement('span');
          dot.className = 'note-dot';
          dayEl.appendChild(dot);
        }
        dayEl.title = checkins[dateStr].note || '已打卡';
      } else if (isWorkday(dateStr) && dateStr <= today) {
        dayEl.classList.add('missed');
        var mdot = document.createElement('span');
        mdot.className = 'missed-dot';
        dayEl.appendChild(mdot);
        dayEl.title = '未打卡';
      }

      dayEl.addEventListener('click', function() {
        var ds = this.dataset.date;
        toggleTaskCheckin(state.currentTaskId, ds);
      });
      dayEl.dataset.date = dateStr;

      grid.appendChild(dayEl);
    }
  }

  // ===== 年视图 =====
  function renderYearView() {
    var grid = document.getElementById('yearGrid');
    grid.innerHTML = '';
    var year = state.calYearView;
    document.getElementById('yearLabel').textContent = year;
    var task = getTask(state.currentTaskId);
    var checkins = task ? getCheckins(task.id) : {};

    for (var m = 0; m < 12; m++) {
      var card = document.createElement('div');
      card.className = 'year-month-card';

      var monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
      var daysInMonth = new Date(year, m+1, 0).getDate();
      var monthPrefix = year + '-' + String(m+1).padStart(2,'0');
      var count = 0;
      var missedCount = 0;

      for (var d = 1; d <= daysInMonth; d++) {
        var ds = monthPrefix + '-' + String(d).padStart(2,'0');
        if (checkins[ds]) count++;
        else if (isWorkday(ds) && ds <= todayStr()) missedCount++;
      }

      var title = document.createElement('div');
      title.className = 'ym-title';
      title.innerHTML = '<span>' + monthNames[m] + '</span><span class="ym-count">' + count + '天</span>';

      var bar = document.createElement('div');
      bar.className = 'ym-bar';
      var fill = document.createElement('div');
      fill.className = 'ym-bar-fill';
      fill.style.width = (daysInMonth > 0 ? (count / daysInMonth * 100) : 0) + '%';
      bar.appendChild(fill);

      var daysGrid = document.createElement('div');
      daysGrid.className = 'ym-days';

      var firstDay = new Date(year, m, 1).getDay();
      for (var i = 0; i < firstDay; i++) {
        var empty = document.createElement('div');
        empty.className = 'ym-day';
        daysGrid.appendChild(empty);
      }

      for (var d = 1; d <= daysInMonth; d++) {
        var ds = monthPrefix + '-' + String(d).padStart(2,'0');
        var de = document.createElement('div');
        de.className = 'ym-day';
        de.textContent = d;
        if (checkins[ds]) de.classList.add('checked');
        else if (isWorkday(ds) && ds <= todayStr()) de.classList.add('missed');
        if (ds === todayStr()) de.classList.add('today');
        daysGrid.appendChild(de);
      }

      card.appendChild(title);
      card.appendChild(bar);
      card.appendChild(daysGrid);
      grid.appendChild(card);
    }
  }

  // ===== 通用打卡操作 =====
  function toggleTaskCheckin(taskId, dateStr) {
    var checkins = getCheckins(taskId);
    var future = new Date(dateStr) > new Date();
    if (future && !checkins[dateStr]) { showToast('不能给未来日期打卡', 'warn'); return; }
    if (checkins[dateStr]) {
      delete checkins[dateStr];
      showToast('已取消打卡');
    } else {
      checkins[dateStr] = { note: '', time: Date.now() };
      showToast('打卡成功！');
    }
    saveData();
    renderAll();
  }

  // ===== 新增任务 =====
  function addTask() {
    var id = 't' + Date.now();
    var colors = ['#6bbf8a','#f0a8c0','#7ec8e3','#f4c95d','#b8a4e3','#e3a47e'];
    var newTask = { id: id, name: '新任务', desc: '', color: colors[state.tasks.length % colors.length] };
    state.tasks.push(newTask);
    state.checkins[id] = {};
    state.currentTaskId = id;
    saveData();
    renderAll();
    startEdit(id);
  }

  // ===== 视图切换 =====
  function switchView(viewName) {
    state.view = viewName;
    document.querySelectorAll('.view-tab').forEach(function(t) {
      t.classList.toggle('active', t.dataset.view === viewName);
    });
    document.querySelectorAll('.view-panel').forEach(function(p) {
      p.classList.toggle('active', p.id === 'view' + viewName.charAt(0).toUpperCase() + viewName.slice(1));
    });
    renderView();
  }

  function renderView() {
    if (state.view === 'day') renderDayView();
    else if (state.view === 'month') renderMonthView();
    else if (state.view === 'year') renderYearView();
  }

  function renderAll() {
    renderTaskList();
    renderHeader();
    renderView();
  }

  // ===== 事件绑定 =====
  function bindEvents() {
    document.getElementById('taskDesc').addEventListener('blur', function() {
      var task = getTask(state.currentTaskId);
      if (task) { task.desc = this.value; saveData(); }
    });

    document.getElementById('addTaskBtn').addEventListener('click', addTask);

    document.querySelectorAll('.view-tab').forEach(function(tab) {
      tab.addEventListener('click', function() { switchView(this.dataset.view); });
    });

    document.getElementById('prevMonth').addEventListener('click', function() {
      state.calMonth--;
      if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
      renderMonthView();
    });
    document.getElementById('nextMonth').addEventListener('click', function() {
      state.calMonth++;
      if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
      renderMonthView();
    });

    document.getElementById('prevYear').addEventListener('click', function() {
      state.calYearView--;
      renderYearView();
    });
    document.getElementById('nextYear').addEventListener('click', function() {
      state.calYearView++;
      renderYearView();
    });
  }

  // ===== 同步模块 =====
  var SYNC_KEY = 'gangnv_sync_config';
  var syncConfig = { token: '', gistId: '', enabled: false, lastPush: 0 };
  var pollTimer = null;
  var remoteEtag = null;

  function loadSyncConfig() {
    try {
      var s = localStorage.getItem(SYNC_KEY);
      if (s) syncConfig = JSON.parse(s);
    } catch(e) {}
  }

  function saveSyncConfig() {
    localStorage.setItem(SYNC_KEY, JSON.stringify(syncConfig));
  }

  function updateSyncUI() {
    var dot = document.getElementById('syncDot');
    var text = document.getElementById('syncStatusText');
    if (syncConfig.enabled && syncConfig.token && syncConfig.gistId) {
      dot.className = 'dot on';
      text.textContent = '同步中';
    } else {
      dot.className = 'dot off';
      text.textContent = '未开启同步 · 点击设置';
    }
  }

  // GitHub API
  function ghHeaders() {
    return {
      'Authorization': 'token ' + syncConfig.token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    };
  }

  function createGist() {
    var payload = {
      description: '我要做港女 · 打卡数据同步',
      public: false,
      files: { 'gangnv-data.json': { content: JSON.stringify(exportData(), null, 2) } }
    };
    return fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: ghHeaders(),
      body: JSON.stringify(payload)
    }).then(function(r) {
      if (!r.ok) throw new Error('创建失败 ' + r.status);
      return r.json();
    });
  }

  function readGist() {
    return fetch('https://api.github.com/gists/' + syncConfig.gistId, {
      headers: ghHeaders()
    }).then(function(r) {
      if (!r.ok) throw new Error('读取失败 ' + r.status);
      remoteEtag = r.headers.get('etag') || remoteEtag;
      return r.json();
    });
  }

  function updateGist() {
    var payload = {
      files: { 'gangnv-data.json': { content: JSON.stringify(exportData(), null, 2) } }
    };
    return fetch('https://api.github.com/gists/' + syncConfig.gistId, {
      method: 'PATCH',
      headers: ghHeaders(),
      body: JSON.stringify(payload)
    }).then(function(r) {
      if (!r.ok) throw new Error('同步失败 ' + r.status);
      remoteEtag = r.headers.get('etag') || remoteEtag;
      return r.json();
    });
  }

  function exportData() {
    return { tasks: state.tasks, checkins: state.checkins, currentTaskId: state.currentTaskId, exportedAt: Date.now() };
  }

  function importData(raw) {
    try {
      var data = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (data.tasks) state.tasks = data.tasks;
      if (data.checkins) state.checkins = data.checkins;
      if (data.currentTaskId) state.currentTaskId = data.currentTaskId;
      state.tasks.forEach(function(t) { if (!state.checkins[t.id]) state.checkins[t.id] = {}; });
      saveData();
      renderAll();
      return true;
    } catch(e) { return false; }
  }

  // 推送数据到云端
  function pushSync() {
    if (!syncConfig.enabled || !syncConfig.token || !syncConfig.gistId) return;
    updateGist().then(function() {
      syncConfig.lastPush = Date.now();
      saveSyncConfig();
      showToast('已同步到云端');
    }).catch(function(e) {
      showToast('同步失败: ' + e.message, 'err');
    });
  }

  // 拉取数据
  function pullSync(silent) {
    if (!syncConfig.enabled || !syncConfig.token || !syncConfig.gistId) return Promise.resolve();
    return readGist().then(function(gist) {
      var content = gist.files && gist.files['gangnv-data.json'] && gist.files['gangnv-data.json'].content;
      if (content) {
        var ok = importData(content);
        if (ok && !silent) showToast('同步成功');
      }
    }).catch(function(e) {
      if (!silent) showToast('拉取失败: ' + e.message, 'err');
    });
  }

  // 轮询检测更新
  var lastGistUpdatedAt = null;
  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    if (!syncConfig.enabled || !syncConfig.gistId) return;
    pollTimer = setInterval(checkRemoteUpdate, 30000);
  }

  function checkRemoteUpdate() {
    if (!syncConfig.enabled || !syncConfig.gistId) return;
    fetch('https://api.github.com/gists/' + syncConfig.gistId, { headers: ghHeaders() })
      .then(function(r) {
        if (!r.ok) return;
        return r.json();
      })
      .then(function(gist) {
        if (!gist) return;
        var updatedAt = gist.updated_at;
        var content = gist.files && gist.files['gangnv-data.json'] && gist.files['gangnv-data.json'].content;
        if (content && updatedAt && lastGistUpdatedAt && updatedAt !== lastGistUpdatedAt) {
          var data = JSON.parse(content);
          if (data.exportedAt > syncConfig.lastPush) {
            showSyncAlert();
          }
        }
        lastGistUpdatedAt = updatedAt || lastGistUpdatedAt;
      })
      .catch(function() {});
  }

  // 页面从后台切回时主动拉取
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && syncConfig.enabled && syncConfig.gistId) {
      pullSync(true);
    }
  });

  // 网络恢复时主动拉取
  window.addEventListener('online', function() {
    if (syncConfig.enabled && syncConfig.gistId) {
      pullSync(true);
    }
  });

  function showSyncAlert() {
    document.getElementById('syncAlert').classList.add('show');
  }

  function hideSyncAlert() {
    document.getElementById('syncAlert').classList.remove('show');
  }

  // 同步设置面板交互
  function openSyncModal() {
    document.getElementById('syncToken').value = syncConfig.token || '';
    document.getElementById('syncGistId').value = syncConfig.gistId || '';
    document.getElementById('syncModalOverlay').classList.add('show');
  }

  function closeSyncModal() {
    document.getElementById('syncModalOverlay').classList.remove('show');
  }

  function saveSyncSettings() {
    var token = document.getElementById('syncToken').value.trim();
    var gistId = document.getElementById('syncGistId').value.trim();
    if (!token) { showToast('请输入 Token', 'warn'); return; }

    syncConfig.token = token;
    syncConfig.gistId = gistId;
    syncConfig.enabled = true;

    if (gistId) {
      // 连接已有 Gist
      saveSyncConfig();
      pullSync().then(function() {
        updateSyncUI();
        startPolling();
        closeSyncModal();
      });
    } else {
      // 创建新 Gist
      createGist().then(function(gist) {
        syncConfig.gistId = gist.id;
        saveSyncConfig();
        updateSyncUI();
        startPolling();
        closeSyncModal();
        showToast('同步仓库已创建');
      }).catch(function(e) {
        showToast('创建失败: ' + e.message, 'err');
      });
    }
  }

  // 绑定同步事件
  document.getElementById('syncStatus').addEventListener('click', openSyncModal);
  document.getElementById('syncCloseBtn').addEventListener('click', closeSyncModal);
  document.getElementById('syncModalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeSyncModal();
  });
  document.getElementById('syncSaveBtn').addEventListener('click', saveSyncSettings);
  document.getElementById('syncAlertBtn').addEventListener('click', function() {
    hideSyncAlert();
    pullSync();
  });

  // 覆盖 saveData，在保存本地数据后自动推送到云端
  var originalSaveData = saveData;
  saveData = function() {
    originalSaveData();
    if (syncConfig.enabled && syncConfig.gistId) {
      // 延迟推送，避免频繁操作
      clearTimeout(window._syncTimeout);
      window._syncTimeout = setTimeout(function() {
        pushSync();
      }, 2000);
    }
  };

  // ===== 启动 =====
  loadData();
  loadSyncConfig();
  bindEvents();
  renderAll();
  updateSyncUI();
  if (syncConfig.enabled && syncConfig.gistId) {
    startPolling();
    pullSync(true);
  }
})();
</script>

</body>
